name: Sync upstream Handy

on:
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true
          git remote add upstream https://github.com/cjpais/Handy.git
          git fetch --no-tags upstream main
          if [ "$(git rev-list --count HEAD..upstream/main)" -eq 0 ]; then
            echo "Fork is already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="chore/sync-upstream"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::An upstream sync branch already exists. Merge its PR or resolve the pending work before starting another sync."
            exit 1
          fi
          git switch -c "$branch"
          if ! git merge --no-edit upstream/main; then
            # Keep only the intentionally fork-owned release workflow. Any
            # other conflict remains visible and stops the sync PR.
            git checkout --ours -- .github/workflows/release.yml || true
            git add .github/workflows/release.yml
            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Upstream changes conflict with fork changes. Resolve manually."
              git diff --name-only --diff-filter=U
              git merge --abort
              exit 1
            fi
            git commit --no-edit
          fi
          git push --set-upstream origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open sync pull request
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "chore: sync upstream Handy" \
            --body "Automated upstream sync from cjpais/Handy/main. Review fork-specific Codex and branding changes before merging."

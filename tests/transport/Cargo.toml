[package]
name = "handy-codex-transport-tests"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
reqwest = { version = "=0.12.28", features = ["blocking", "json", "multipart", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5.1"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
plist = "1"
log = "0.4"
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "time", "rt-multi-thread"] }

[profile.dev]
debug = 0
